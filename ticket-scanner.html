<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ticket Finder</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg:        #0B0D0F;
    --panel:     #15181B;
    --panel-2:   #1D2126;
    --line:      #2A2F35;
    --text:      #F2F1EC;
    --text-dim:  #9AA0A6;
    --amber:     #FFB020;
    --amber-dim: #7A5A18;
    --green:     #35D07F;
    --red:       #FF5252;
    --mono: ui-monospace, "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- Setup screen ---------- */
  #setup-screen{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; gap:22px; text-align:center;
  }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.18em;
    color:var(--amber); text-transform:uppercase;
  }
  #setup-screen h1{ margin:0; font-size:26px; font-weight:700; }
  #setup-screen p.sub{ margin:0; color:var(--text-dim); font-size:14px; max-width:320px; line-height:1.5; }
  #ticket-input{
    width:100%; max-width:320px; background:var(--panel); border:2px solid var(--line);
    color:var(--amber); font-family:var(--mono); font-size:32px; letter-spacing:.08em;
    text-align:center; padding:16px 10px; border-radius:12px; outline:none;
  }
  #ticket-input:focus{ border-color:var(--amber); }
  .btn-primary{
    width:100%; max-width:320px; background:var(--amber); color:#1A1300; border:none;
    font-weight:700; font-size:17px; padding:16px; border-radius:12px;
  }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.5; }
  .btn-secondary{
    width:100%; max-width:320px; background:transparent; color:var(--text);
    border:1.5px solid var(--line); font-size:15px; padding:14px; border-radius:12px;
  }
  .btn-link{ background:none; border:none; color:var(--text-dim); font-size:14px; text-decoration:underline; padding:8px; }

  /* ---------- Scan screen ---------- */
  #scan-screen{ position:relative; flex:1; overflow:hidden; background:#000; }
  #video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #scan-top{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
  }
  #scan-target{ font-family:var(--mono); font-size:15px; color:#fff; }
  #scan-target b{ color:var(--amber); font-size:18px; letter-spacing:.06em; }
  #stop-btn{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);
    padding:9px 16px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .reticle{
    position:absolute; left:8%; right:8%; top:30%; bottom:30%; z-index:4;
    border:2px solid rgba(255,176,32,.55); border-radius:14px; pointer-events:none;
  }
  .reticle .scanline{
    position:absolute; left:0; right:0; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity:0; box-shadow:0 0 8px var(--amber);
  }
  .reticle.processing .scanline{ opacity:1; animation:sweep 1.1s ease-in-out infinite; }
  @keyframes sweep{
    0%{ top:2%; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ top:96%; opacity:0; }
  }
  .reticle .prop{
    position:absolute; top:-16px; width:32px; height:32px;
    transform-origin:50% 50%; animation:propSpin 3.2s linear infinite;
    filter:drop-shadow(0 0 4px rgba(255,176,32,.55));
  }
  .reticle .prop.left{ left:-16px; }
  .reticle .prop.right{ right:-16px; }
  .reticle.processing .prop{ animation-duration:.35s; }
  @keyframes propSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  #scan-bottom{
    position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex;
    flex-direction:column; align-items:center; gap:8px;
    padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);
    background:linear-gradient(to top, rgba(0,0,0,.8), transparent);
  }
  #status-pill{
    display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.15); padding:7px 14px; border-radius:20px;
    font-size:13px; color:var(--text-dim);
  }
  #status-dot{
    width:8px; height:8px; border-radius:50%; background:var(--amber);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  /* ---------- Result screen ---------- */
  #result-screen{
    flex:1; display:flex; flex-direction:column; background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    gap:14px; overflow-y:auto;
  }
  #found-banner{
    display:flex; align-items:center; gap:10px; background:rgba(53,208,127,.12);
    border:1px solid var(--green); color:var(--green); font-weight:700;
    padding:12px 16px; border-radius:12px; font-size:15px; justify-content:center;
  }
  #shot-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:#000; border-radius:14px; overflow:hidden; border:1px solid var(--line);
    min-height:0;
  }
  #frameCanvas{ max-width:100%; max-height:100%; display:block; }
  #result-actions{ display:flex; flex-direction:column; gap:10px; }

  /* ---------- Permission error ---------- */
  #error-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:16px; text-align:center;
  }
  #error-screen p{ color:var(--text-dim); font-size:14px; max-width:320px; line-height:1.5; }

  /* ---------- Loading overlay ---------- */
  #loading-overlay{
    position:absolute; inset:0; z-index:20; background:rgba(11,13,15,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  .spinner{
    width:34px; height:34px; border-radius:50%; border:3px solid var(--line);
    border-top-color:var(--amber); animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading-overlay p{ color:var(--text-dim); font-size:13px; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ SCREEN 1: enter the ticket number ============ -->
  <div id="setup-screen">
    <div class="eyebrow">Ohio Drone Repair</div>
    <h1>Ticket Finder</h1>
    <p class="sub">Type the ticket number printed on the box label. Point your camera at the shelves and it'll watch for that number and tell you when it sees it.</p>
    <input id="ticket-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="12345" maxlength="12" autocomplete="off">
    <button id="start-btn" class="btn-primary">Start Scanning</button>
  </div>

  <!-- ============ SCREEN 2: live camera + OCR loop ============ -->
  <div id="scan-screen" class="hidden">
    <video id="video" autoplay playsinline muted></video>
    <div class="reticle" id="reticle">
      <div class="scanline"></div>
      <svg class="prop left" viewBox="0 0 40 40"><circle cx="20" cy="20" r="3" fill="var(--amber)"/><ellipse cx="20" cy="20" rx="17" ry="3" fill="var(--amber)" opacity=".85"/><ellipse cx="20" cy="20" rx="3" ry="17" fill="var(--amber)" opacity=".85"/></svg>
      <svg class="prop right" viewBox="0 0 40 40"><circle cx="20" cy="20" r="3" fill="var(--amber)"/><ellipse cx="20" cy="20" rx="17" ry="3" fill="var(--amber)" opacity=".85"/><ellipse cx="20" cy="20" rx="3" ry="17" fill="var(--amber)" opacity=".85"/></svg>
    </div>
    <div id="scan-top">
      <div id="scan-target">Looking for <b id="scan-target-num"></b></div>
      <button id="stop-btn">Cancel</button>
    </div>
    <div id="scan-bottom">
      <div id="status-pill"><span id="status-dot"></span><span id="status-text">Scanning…</span></div>
    </div>
    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <p id="loading-text">Loading text recognizer…</p>
    </div>
  </div>

  <!-- ============ SCREEN 3: match found ============ -->
  <div id="result-screen" class="hidden">
    <div id="found-banner">✓ Found ticket <span id="found-num"></span></div>
    <div id="shot-wrap"><canvas id="frameCanvas"></canvas></div>
    <div id="result-actions">
      <button id="keep-scanning-btn" class="btn-primary">Keep Scanning</button>
      <button id="save-shot-btn" class="btn-secondary">Save Screenshot</button>
      <button id="new-search-btn" class="btn-link">Search a different number</button>
    </div>
  </div>

  <!-- ============ SCREEN 4: camera permission problem ============ -->
  <div id="error-screen" class="hidden">
    <div class="eyebrow" style="color:var(--red)">Camera unavailable</div>
    <p id="error-message">Chrome couldn't access the camera.</p>
    <button id="retry-btn" class="btn-primary" style="max-width:280px">Try Again</button>
  </div>

</div>

<!-- Tesseract.js — on-device OCR engine, loaded from CDN -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* =====================================================================
   TICKET FINDER — plain-language map of what this program does
   =====================================================================
   1. You type the ticket number you're hunting for.
   2. We turn on the rear camera and show the live picture full-screen.
   3. About twice a second, we grab a single still frame from the video
      (like pressing pause), clean it up a bit, and hand it to an OCR
      engine (Tesseract) that reads any digits it can find in that frame.
   4. We compare every number it read against the one you typed.
   5. If one matches, we vibrate/beep, draw a green box around it on
      that still frame, and show it to you as a "screenshot" you can
      keep scanning past, or save to your phone.
   This loop is a simple "repeat until stopped" structure — the same
   idea as a GOSUB inside a FOR/NEXT loop that keeps going until a
   flag gets set to false.
   ===================================================================== */

// ---- grab all the elements we'll need ----
const setupScreen   = document.getElementById('setup-screen');
const scanScreen    = document.getElementById('scan-screen');
const resultScreen  = document.getElementById('result-screen');
const errorScreen   = document.getElementById('error-screen');
const loadingOverlay= document.getElementById('loading-overlay');
const loadingText   = document.getElementById('loading-text');

const ticketInput   = document.getElementById('ticket-input');
const startBtn      = document.getElementById('start-btn');
const stopBtn       = document.getElementById('stop-btn');
const retryBtn      = document.getElementById('retry-btn');
const keepScanBtn   = document.getElementById('keep-scanning-btn');
const saveShotBtn   = document.getElementById('save-shot-btn');
const newSearchBtn  = document.getElementById('new-search-btn');

const video          = document.getElementById('video');
const reticle         = document.getElementById('reticle');
const scanTargetNum  = document.getElementById('scan-target-num');
const foundNum       = document.getElementById('found-num');
const statusText     = document.getElementById('status-text');
const frameCanvas    = document.getElementById('frameCanvas');
const errorMessage   = document.getElementById('error-message');

// ---- program state ----
let mediaStream = null;   // the live camera stream
let ocrWorker   = null;   // the Tesseract worker, created once and reused
let target      = '';     // the digits we're hunting for
let scanning    = false;  // true while the capture/OCR loop should run

// A capture canvas we draw video frames into for OCR (kept off-screen
// while scanning; reused as the "screenshot" canvas the moment we find
// a match).
const ctx = frameCanvas.getContext('2d', { willReadFrequently: true });

function showScreen(el){
  [setupScreen, scanScreen, resultScreen, errorScreen].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
}

// ---- one-time setup of the OCR engine ----
async function ensureWorker(){
  if (ocrWorker) return ocrWorker;
  loadingText.textContent = 'Loading text recognizer…';
  loadingOverlay.classList.remove('hidden');
  ocrWorker = await Tesseract.createWorker('eng');
  // Digits plus '#' — your tickets are always printed as "#12345", so
  // letting Tesseract recognize the '#' as itself (rather than forcing
  // it to misread that shape as a stray digit) keeps the number itself
  // cleaner. We still strip the '#' back out before comparing.
  await ocrWorker.setParameters({
    tessedit_char_whitelist: '#0123456789',
    tessedit_pageseg_mode: '11'
  });
  loadingOverlay.classList.add('hidden');
  return ocrWorker;
}

// ---- turn the camera on and kick off scanning ----
async function startScanning(){
  target = ticketInput.value.replace(/[^0-9]/g, '');
  if (!target){
    ticketInput.focus();
    return;
  }
  scanTargetNum.textContent = '#' + target;
  showScreen(scanScreen);

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
      audio: false
    });
    video.srcObject = mediaStream;
    await video.play();
    applyZoomIfSupported(mediaStream);
  } catch(err){
    showCameraError(err);
    return;
  }

  await ensureWorker();
  scanning = true;
  statusText.textContent = 'Scanning…';
  runLoop();
}

// ---- ask the camera to zoom in a bit, if the phone/browser allows it ----
// (Not all devices expose this — if it's not supported, this quietly
// does nothing and the app just runs at normal 1x.) Bumped from 2x to
// 2.5x since real scanning distance is a few feet, not close-up.
async function applyZoomIfSupported(stream){
  try{
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : null;
    if (caps && caps.zoom){
      const desired = Math.min(caps.zoom.max, Math.max(caps.zoom.min, 2.5));
      await track.applyConstraints({ advanced: [{ zoom: desired }] });
    }
  } catch(e){ /* zoom not supported here — that's fine, just skip it */ }
}

function showCameraError(err){
  let msg = "Chrome couldn't access the camera. ";
  if (err && err.name === 'NotAllowedError'){
    msg += 'Camera permission was denied — check the site permissions (tap the lock icon in the address bar) and allow Camera, then try again.';
  } else if (err && err.name === 'NotFoundError'){
    msg += 'No camera was found on this device.';
  } else {
    msg += 'Try again, or reload the page.';
  }
  errorMessage.textContent = msg;
  showScreen(errorScreen);
}

// ---- the main repeat-until-stopped loop ----
async function runLoop(){
  while (scanning){
    reticle.classList.add('processing');
    const match = await captureAndRecognize();
    reticle.classList.remove('processing');

    if (match){
      handleMatch(match);
      return; // pause the loop — "Keep Scanning" starts it again
    }
    // brief pause before the next capture so we don't hammer the CPU
    await sleep(120);
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// An offscreen canvas we capture each raw frame into before testing it
// at different rotations. Never shown on screen directly.
const captureCanvas = document.createElement('canvas');
const captureCtx = captureCanvas.getContext('2d', { willReadFrequently: true });

// Labels don't always sit upright on the box, and checking every
// rotation catches that — but it costs up to 4x the OCR time per frame.
// For a fast walking scan we default to just upright (0°). If your real
// bin labels turn out to often be sideways or flipped, change this back
// to [0, 90, 180, 270] and we trade speed for that extra coverage.
const ROTATIONS = [0];

function rotatedCopy(sourceCanvas, angleDeg){
  if (angleDeg === 0) return sourceCanvas;
  const sw = sourceCanvas.width, sh = sourceCanvas.height;
  const out = document.createElement('canvas');
  const swapped = (angleDeg === 90 || angleDeg === 270);
  out.width  = swapped ? sh : sw;
  out.height = swapped ? sw : sh;
  const octx = out.getContext('2d');
  octx.save();
  octx.translate(out.width / 2, out.height / 2);
  octx.rotate(angleDeg * Math.PI / 180);
  octx.drawImage(sourceCanvas, -sw / 2, -sh / 2);
  octx.restore();
  return out;
}

function applyGrayContrast(ctx2d, w, h){
  // Grayscale + contrast boost — printed labels read much more
  // reliably once the background/foreground contrast is stretched.
  // Your real tickets are black text on a light laminated background —
  // genuinely high native contrast — so we can push this a bit harder
  // than a generic "unknown lighting" default.
  const imgData = ctx2d.getImageData(0, 0, w, h);
  const d = imgData.data;
  const contrast = 1.6;
  for (let i = 0; i < d.length; i += 4){
    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    let v = (gray - 128) * contrast + 128;
    v = v < 0 ? 0 : (v > 255 ? 255 : v);
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx2d.putImageData(imgData, 0, 0);
}

// Is there a word containing '#' sitting immediately to the left of this
// digit word, on the same line? Tesseract sometimes reads the '#' and
// the digits as two separate tokens rather than one fused "#12345".
function hasAdjacentHash(words, digitWord){
  const lineHeight = digitWord.bbox.y1 - digitWord.bbox.y0;
  for (const w of words){
    if (w === digitWord || !w.text.includes('#')) continue;
    const sameLine = Math.abs(w.bbox.y0 - digitWord.bbox.y0) < lineHeight * 0.6;
    const justToTheLeft = w.bbox.x1 <= digitWord.bbox.x0 + lineHeight * 0.5 &&
                           w.bbox.x1 >= digitWord.bbox.x0 - lineHeight * 3;
    if (sameLine && justToTheLeft) return true;
  }
  return false;
}

function findMatchInData(data){
  const words = data.words || [];

  // Highest confidence: a word shaped exactly like your real tickets —
  // "#" immediately followed by the target digits, nothing else. That's
  // precisely how these labels are printed, so a hit in this exact shape
  // is very unlikely to be a coincidence (a phone number or zip code
  // elsewhere on the label, for instance).
  for (const word of words){
    if (word.text.replace(/\s+/g, '') === ('#' + target)) return { bbox: word.bbox };
  }
  // Next best: the digits with a separate '#' token confirmed just to
  // the left of them.
  for (const word of words){
    const cleaned = word.text.replace(/[^0-9]/g, '');
    if (cleaned === target && hasAdjacentHash(words, word)) return { bbox: word.bbox };
  }
  // Still good: just the digits themselves, no confirmed '#' — OCR
  // sometimes drops the symbol (glare off the laminated label).
  for (const word of words){
    const cleaned = word.text.replace(/[^0-9]/g, '');
    if (cleaned && cleaned === target) return { bbox: word.bbox };
  }
  // Fall back to a whole recognized line containing the number, in case
  // OCR split the digits into separate tokens with a stray gap.
  for (const line of (data.lines || [])){
    const cleaned = line.text.replace(/[^0-9]/g, '');
    if (cleaned && cleaned.includes(target)) return { bbox: line.bbox };
  }
  return null;
}

// Grow the matched number's box to cover the rest of the ticket, not
// just the digits — folding in any other detected text that belongs to
// the same label. With labels packed tightly side by side and stacked
// on real shelves, we deliberately keep this narrow and DOWNWARD ONLY —
// your own description of the layout (number, then logo, then details,
// always stacked in a single column below the number) means there's
// never a reason to reach sideways or upward, which is exactly where a
// neighboring ticket would be sitting.
function expandToWholeTicket(words, matchBbox){
  let { x0, y0, x1, y1 } = matchBbox;
  const lineHeight = y1 - y0;
  const vReachBelow = lineHeight * 2.5; // how far below counts as "part of this ticket"
  const hSlack = (x1 - x0) * 0.6;       // a little horizontal give for centered text

  for (const w of words){
    const b = w.bbox;
    const isBelow = b.y0 >= y0 - lineHeight * 0.3 && b.y0 <= y1 + vReachBelow;
    const inColumn = b.x0 < x1 + hSlack && b.x1 > x0 - hSlack;
    if (isBelow && inColumn){
      x0 = Math.min(x0, b.x0);
      y0 = Math.min(y0, b.y0);
      x1 = Math.max(x1, b.x1);
      y1 = Math.max(y1, b.y1);
    }
  }
  return { x0, y0, x1, y1 };
}


// The reticle on screen isn't just decoration — this is the exact same
// band that actually gets read. Keep the row of labels running through
// that box as you walk. Widened from a tight quarter-height band to
// roughly 40% of the frame height — more forgiving to aim now that
// misses (not speed) are the priority, and boxes are confirmed upright
// so we don't need extra margin for rotation safety.
const SCAN_BAND = { leftPct: 0.08, rightPct: 0.08, topPct: 0.30, bottomPct: 0.30 };

// ---- barcode reading (fast path, tried before OCR) ----
// Off for now: there are no real barcodes yet, so this ran every single
// frame for guaranteed zero payoff — pure wasted time. Flip this to
// true the moment there's a real barcode label to test against.
const ENABLE_BARCODE = false;

// Chrome on Android has a built-in barcode/QR reader — no extra library
// needed. Not every device supports it, so this quietly falls through
// to OCR when unavailable or when nothing's found.
let barcodeDetector; // undefined = not checked yet, null = unsupported here
async function ensureBarcodeDetector(){
  if (barcodeDetector !== undefined) return barcodeDetector;
  if (!('BarcodeDetector' in window)){
    barcodeDetector = null;
    return barcodeDetector;
  }
  try{
    const supported = await BarcodeDetector.getSupportedFormats();
    barcodeDetector = new BarcodeDetector({ formats: supported });
  } catch(e){
    barcodeDetector = null;
  }
  return barcodeDetector;
}

// We don't yet know exactly what a real barcode will encode (the bare
// ticket number, a full URL containing it, something else) — so this
// checks a few reasonable shapes rather than requiring an exact match.
function barcodeMatchesTarget(rawValue){
  if (!rawValue) return false;
  if (rawValue === target) return true;
  if (rawValue.replace(/[^0-9]/g, '') === target) return true;
  return rawValue.includes(target);
}

async function tryBarcodeMatch(canvas){
  if (!ENABLE_BARCODE) return null;
  const detector = await ensureBarcodeDetector();
  if (!detector) return null;
  try{
    const barcodes = await detector.detect(canvas);
    for (const bc of barcodes){
      if (barcodeMatchesTarget(bc.rawValue)){
        const r = bc.boundingBox;
        return { canvas, bbox: { x0: r.x, y0: r.y, x1: r.x + r.width, y1: r.y + r.height } };
      }
    }
  } catch(e){ /* detector hiccup this frame — just fall through to OCR */ }
  return null;
}

// ---- grab the reticle band, try the barcode reader, then fall back to OCR ----
async function captureAndRecognize(){
  if (!video.videoWidth) return null;

  const vw = video.videoWidth, vh = video.videoHeight;
  const cropX = Math.round(vw * SCAN_BAND.leftPct);
  const cropW = Math.round(vw * (1 - SCAN_BAND.leftPct - SCAN_BAND.rightPct));
  const cropY = Math.round(vh * SCAN_BAND.topPct);
  const cropH = Math.round(vh * (1 - SCAN_BAND.topPct - SCAN_BAND.bottomPct));

  // Downscale to a width that's fast to process but still legible.
  // Bumped back up for better accuracy on real labels at shelf distance —
  // this trades a bit of the walking-speed we tuned for last round.
  const targetWidth = 1100;
  const scale = Math.min(1, targetWidth / cropW);
  const w = Math.round(cropW * scale);
  const h = Math.round(cropH * scale);
  captureCanvas.width = w;
  captureCanvas.height = h;
  captureCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, w, h);

  // Try the barcode reader first, on the raw (still full-color) frame —
  // it's much faster and far more reliable than OCR whenever a label
  // actually has one.
  const barcodeMatch = await tryBarcodeMatch(captureCanvas);
  if (barcodeMatch) return barcodeMatch;

  // No barcode found on this label (or the device doesn't support
  // reading one) — fall back to reading the printed number, same as before.
  applyGrayContrast(captureCtx, w, h);

  for (const angle of ROTATIONS){
    const testCanvas = rotatedCopy(captureCanvas, angle);
    const { data } = await ocrWorker.recognize(testCanvas);
    const found = findMatchInData(data);
    if (found){
      const ticketBox = expandToWholeTicket(data.words || [], found.bbox);
      return { canvas: testCanvas, bbox: ticketBox };
    }
  }
  return null;
}

// ---- a match was found: alert, highlight, show the result screen ----
function handleMatch(match){
  scanning = false;

  if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  beep();

  // Draw a highlight box directly on the canvas that matched (whichever
  // rotation that was) — so the screenshot always shows the number
  // right-side-up, even if the label itself was sideways or flipped.
  const src = match.canvas;
  const sctx = src.getContext('2d');
  const { x0, y0, x1, y1 } = match.bbox;
  const pad = Math.max(6, (x1 - x0) * 0.15);
  sctx.lineWidth = Math.max(3, src.width * 0.006);
  sctx.strokeStyle = '#35D07F';
  sctx.shadowColor = 'rgba(53,208,127,.9)';
  sctx.shadowBlur = 10;
  sctx.strokeRect(x0 - pad, y0 - pad, (x1 - x0) + pad * 2, (y1 - y0) + pad * 2);
  sctx.shadowBlur = 0;

  // Copy the (now highlighted) canvas onto the visible result canvas.
  frameCanvas.width = src.width;
  frameCanvas.height = src.height;
  ctx.drawImage(src, 0, 0);

  foundNum.textContent = '#' + target;
  showScreen(resultScreen);
}

function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    [0, 0.16].forEach(delay => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'square';
      o.frequency.value = 950;
      g.gain.setValueAtTime(0.001, ac.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + 0.12);
      o.start(ac.currentTime + delay);
      o.stop(ac.currentTime + delay + 0.14);
    });
    setTimeout(() => ac.close(), 500);
  } catch(e){ /* audio isn't essential — fail quietly */ }
}

// ---- stop the camera entirely and release it ----
function stopCamera(){
  scanning = false;
  if (mediaStream){
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

// ---- button wiring ----
startBtn.addEventListener('click', startScanning);
ticketInput.addEventListener('keydown', e => { if (e.key === 'Enter') startScanning(); });

stopBtn.addEventListener('click', () => {
  stopCamera();
  showScreen(setupScreen);
});

retryBtn.addEventListener('click', () => {
  showScreen(setupScreen);
});

keepScanBtn.addEventListener('click', () => {
  showScreen(scanScreen);
  scanning = true;
  statusText.textContent = 'Scanning…';
  runLoop();
});

newSearchBtn.addEventListener('click', () => {
  stopCamera();
  ticketInput.value = '';
  showScreen(setupScreen);
  ticketInput.focus();
});

saveShotBtn.addEventListener('click', () => {
  frameCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ticket-${target}-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
});
</script>
</body>
